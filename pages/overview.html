<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>被墙检测总览</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js"></script>
</head>
<body data-page="overview">
  <main>
    <header class="page-head">
      <div>
        <h1>被墙检测总览</h1>
        <p class="subtitle">反向：受检服务器 → 大陆目标；正向：境内探针 → 受检服务器；非大陆目标用作连通性对照。</p>
      </div>
      <div class="head-actions">
        <span id="last-poll" class="muted small"></span>
        <button id="refresh" class="button subtle" type="button">刷新</button>
      </div>
    </header>
    <div id="message" class="alert" role="status" hidden></div>
    <div id="selection-notice" class="alert info" role="status" hidden></div>
    <section class="summary" aria-label="运行情况">
      <span id="mode" class="pill">正在加载</span>
      <span id="schedule"></span>
      <span id="notification-status"></span>
    </section>
    <section id="stats" class="stats" aria-label="按状态筛选"></section>
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>服务器状态</h2>
          <p>“疑似被墙”是根据 TCP 连通性做出的推断，不代表已确认封锁原因。</p>
        </div>
        <label class="sr-only" for="search">搜索服务器</label>
        <input id="search" type="search" placeholder="搜索名称、分组或 IP">
      </div>
      <div class="table-wrap">
        <table role="table" aria-label="服务器探测结果">
          <thead id="matrix-head" role="rowgroup"></thead>
          <tbody id="matrix" role="rowgroup"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>
        <h3>还没有受检服务器</h3>
        <p>选择服务器并启用监测后，探测结果会显示在这里。</p>
        <a class="button" href="/admin/plugins/config?short=komari-gfw" target="_blank" rel="noopener">前往配置</a>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>状态变更与通知</h2>
          <p>保留最近 7 天，最多 100 条。</p>
        </div>
      </div>
      <div id="events" class="event-list"></div>
    </section>
    <details id="visibility-diagnostics" class="panel" hidden>
      <summary>接口过滤诊断 <span id="visibility-count" class="pill plain"></span></summary>
      <p class="note">插件会把自己创建的探测任务从 Komari 的延迟监测界面和接口中隐藏。这里列出本次运行中无法安全过滤、因而被拦截的响应；插件重启后清空。</p>
      <div id="visibility-failures"></div>
    </details>
    <footer>
      <span>只采用新鲜且完整的探测结果；服务器离线或上报缺失不计为连接失败。</span>
      <span>被墙检测 0.1.9</span>
    </footer>
  </main>
</body>
</html>
